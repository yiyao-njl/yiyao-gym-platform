server:
  port: 8080

spring:
  application:
    name: gym-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${GYM_AUTH_URI:http://localhost:8101}
          predicates:
            - Path=/api/auth/**,/api/admin/me,/api/admin/accounts/**,/api/admin/logs/**
        - id: marketing-service
          uri: ${GYM_MARKETING_URI:http://localhost:8106}
          predicates:
            - Path=/api/app/home,/api/app/banners,/api/app/activities/**,/api/app/coupons/**,/api/admin/coupons/**,/api/admin/activities/**
        - id: venue-service
          uri: ${GYM_VENUE_URI:http://localhost:8103}
          predicates:
            - Path=/api/app/cities/**,/api/app/stores/**,/api/app/venues/**,/api/app/reservations/**,/api/admin/stores/**,/api/admin/venues/**,/api/admin/venue-types/**,/api/admin/venue-packages/**
        - id: order-service
          uri: ${GYM_ORDER_URI:http://localhost:8104}
          predicates:
            - Path=/api/app/cart/**,/api/app/orders/**,/api/admin/orders/**,/api/admin/refunds/**
        - id: payment-service
          uri: ${GYM_PAYMENT_URI:http://localhost:8105}
          predicates:
            - Path=/api/app/payments/**,/api/admin/payments/**
        - id: member-service
          uri: ${GYM_MEMBER_URI:http://localhost:8107}
          predicates:
            - Path=/api/app/members/**,/api/admin/members/**,/api/admin/users/**
        - id: review-service
          uri: ${GYM_REVIEW_URI:http://localhost:8108}
          predicates:
            - Path=/api/app/orders/*/review,/api/app/venues/*/reviews,/api/admin/reviews/**
        - id: message-service
          uri: ${GYM_MESSAGE_URI:http://localhost:8109}
          predicates:
            - Path=/internal/messages/**
        - id: user-service
          uri: ${GYM_USER_URI:http://localhost:8102}
          predicates:
            - Path=/api/app/users/**
        - id: statistics-service
          uri: ${GYM_STATISTICS_URI:http://localhost:8110}
          predicates:
            - Path=/api/admin/statistics/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
